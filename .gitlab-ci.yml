include:
  - component: gitlab.com/PassiveLogic/ci/commitlint@4
  - component: gitlab.com/PassiveLogic/ci/swiftlint@4
  - component: gitlab.com/PassiveLogic/ci/swiftformat@4
  - component: gitlab.com/PassiveLogic/ci/swift-import-analyzer@4
  - component: gitlab.com/PassiveLogic/ci/swift-api-check@4
    inputs:
      swift-image: registry.gitlab.com/passivelogic/compiler/swift
      runner-tags:
        - passivelogic-linux-small-arm64
  - component: gitlab.com/PassiveLogic/ci/swift-build@4
    inputs:
      swift-image: registry.gitlab.com/passivelogic/compiler/swift
      runner-tags:
        - passivelogic-compiler-orin
      job-rules:
        - when: always
      additional-teardown:
        - swift run nvidia-device-query
  - component: gitlab.com/PassiveLogic/ci/container-image-build@4
    inputs:
      platform: linux/arm64
      runner-tags: ["passivelogic-linux-medium-arm64"]
  - component: gitlab.com/PassiveLogic/ci/container-image-vend@4
    inputs:
      build-jobs:
        - container-image-build linux/arm64

